[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-model"
version = "0.1.0"
description = "Evaluation harness for word problem -> authoring scene models"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
parser-eval = "parser_model.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# long natural-language templates
"src/parser_model/unsupported.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["solver: runs the real TypeScript solver (needs pnpm and Node 24)"]
